<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- O GitHub Pages serve o index.html com cache de alguns minutos. Como o
         bundle tem hash no nome, um index velho aponta para o JS ANTIGO, e uma
         correção recém-publicada parece não ter subido. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Herdeiro da Chama</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; height: 100%; }
      #game-container { display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
