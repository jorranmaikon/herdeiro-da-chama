<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Herdeiro da Chama — Documentação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Documentação oficial do projeto Herdeiro da Chama" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/docsify/4.13.1/themes/vue.min.css" />
  <style>
    :root {
      --theme-color: #ffb84d;
    }
    .sidebar {
      background: #1a1410;
    }
    .sidebar-nav li > a {
      color: #e0d8c8;
    }
    .sidebar-nav li.active > a {
      color: #ffb84d;
    }
    .app-name-link img {
      display: none;
    }
    body {
      background: #0f0d0a;
    }
    .markdown-section {
      color: #e0d8c8;
    }
    .markdown-section h1,
    .markdown-section h2 {
      color: #ffb84d;
      border-bottom: 1px solid #3a2f22;
    }
    .markdown-section code {
      background: #241d15;
      color: #ffb84d;
    }
    .markdown-section pre {
      background: #1a1410;
    }
    .markdown-section table tr {
      background: #1a1410;
    }
    .markdown-section table tr:nth-child(2n) {
      background: #241d15;
    }
    .markdown-section blockquote {
      border-left-color: #ffb84d;
      color: #b0a48f;
    }
    .search input {
      background: #241d15;
      color: #e0d8c8;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Herdeiro da Chama',
      repo: 'Jorranmaikon/herdeiro-da-chama',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        placeholder: 'Buscar na documentação...',
        noData: 'Nada encontrado.',
        depth: 3,
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: 'Copiado',
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Próximo',
        crossChapter: true,
      },
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docsify/4.13.1/docsify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docsify/4.13.1/plugins/search.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docsify-copy-code/2.1.1/docsify-copy-code.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docsify-pagination/2.7.0/docsify-pagination.min.js"></script>
</body>
</html>
